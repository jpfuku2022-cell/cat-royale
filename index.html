
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CAT ROYALE</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  overflow: hidden; background: #9bb1bd;
  font-family: system-ui, sans-serif;
  touch-action: none;
}
canvas { display: block; }
#hud {
  position: fixed; top: 14px; left: 14px; right: 14px;
  display: flex; justify-content: space-between;
  color: white; pointer-events: none; z-index: 2;
}
.panel {
  background: #263642e8; padding: 12px 16px;
  border-radius: 14px; font-weight: 700;
  box-shadow: 0 2px 8px #0003;
}
.small { font-size: 11px; color: #c5d1d8; }
#message {
  position: fixed; left: 50%; top: 43%;
  transform: translate(-50%,-50%);
  color: white; font-size: clamp(22px,4vw,40px);
  font-weight: 900; text-shadow: 0 3px 5px #0008;
  text-align: center; pointer-events: none; z-index: 2;
}
#status {
  position: fixed; top: 90px; left: 50%;
  transform: translateX(-50%); color: white;
  background: #263642dd; padding: 8px 12px;
  border-radius: 9px; font-size: 13px;
  text-align: center; z-index: 5; max-width: 90%;
}
#help {
  position: fixed; bottom: 12px; left: 12px;
  color: white; background: #263642d9;
  border-radius: 10px; padding: 9px 12px;
  font-size: 12px; z-index: 2; pointer-events: none;
}
#start {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: #15232bcc; color: white; text-align: center;
  padding: 24px;
}
#start button {
  border: 0; border-radius: 14px; padding: 15px 26px;
  font-size: 18px; font-weight: 800;
  background: #f3f6f7; color: #243541;
}
</style>
</head>
<body>
<div id="hud">
  <div class="panel">
    <div class="small">PLAYER STATUS</div>
    <div>CAT EXPLORER</div>
    <div class="small">ステージを探検しよう</div>
  </div>
  <div class="panel" style="text-align:right">
    <div class="small">CAT FRIENDS</div>
    <div id="count">0</div>
  </div>
</div>

<div id="message">生き残ってみせろ。</div>
<div id="status">3Dステージを読み込み中…</div>

<div id="help">
  左側：移動<br>
  右側：視点変更<br>
  PC：WASD / マウス
</div>

<div id="start">
  <div>
    <h1>🐱 CAT ROYALE</h1>
    <p>広いステージを探検して、猫たちを見つけよう！</p>
    <button id="startBtn">ゲームスタート</button>
    <p class="small">開始するとBGMを再生します</p>
  </div>
</div>

<audio id="bgm" loop preload="auto"></audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = id => document.getElementById(id);
const status = $("status");

let scene, camera, renderer, stage;
let started = false;
let yaw = 0, pitch = 0;
let moveX = 0, moveZ = 0;
let lastTime = 0;
const keys = {};
const cats = [];
const loader = new GLTFLoader();
const clock = new THREE.Clock();

function say(text) {
  status.textContent = text;
}

function candidates(name) {
  return ["./" + name, "./assets/" + name];
}

async function loadGLB(name) {
  let lastError;
  for (const url of candidates(name)) {
    try {
      return await new Promise((resolve, reject) => {
        loader.load(url, resolve, undefined, reject);
      });
    } catch (e) {
      lastError = e;
      console.warn("読み込み失敗:", url, e);
    }
  }
  throw lastError || new Error(name + " が見つかりません");
}

async function loadImageTexture(name) {
  let lastError;
  for (const url of candidates(name)) {
    try {
      const texture = await new Promise((resolve, reject) => {
        new THREE.TextureLoader().load(url, resolve, undefined, reject);
      });
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error(name + " が見つかりません");
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bb1bd);
  scene.fog = new THREE.Fog(0x9bb1bd, 100, 500);

  camera = new THREE.PerspectiveCamera(
    75, innerWidth / innerHeight, 0.1, 1000
  );
  camera.position.set(0, 2, 8);
  camera.rotation.order = "YXZ";

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x596657, 2));

  const sun = new THREE.DirectionalLight(0xffffff, 2);
  sun.position.set(40, 80, 30);
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1000, 1000),
    new THREE.MeshStandardMaterial({ color: 0x879487 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.15;
  scene.add(ground);
}

async function loadStage() {
  try {
    const gltf = await loadGLB("stage.glb");
    stage = gltf.scene;

    stage.traverse(obj => {
      if (obj.isMesh) {
        obj.castShadow = false;
        obj.receiveShadow = false;
        if (obj.material) {
          obj.material.side = THREE.DoubleSide;
        }
      }
    });

    const box = new THREE.Box3().setFromObject(stage);
    const center = box.getCenter(new THREE.Vector3());

    stage.position.x -= center.x;
    stage.position.z -= center.z;

    scene.add(stage);
    say("ステージ読み込み成功！");
    return true;
  } catch (e) {
    console.error(e);
    say("stage.glbを読み込めません。ファイル名と場所を確認してね。");
    return false;
  }
}

async function loadCats() {
  try {
    const texture = await loadImageTexture("cat.png");
    const material = new THREE.SpriteMaterial({
      map: texture,
      transparent: true,
      alphaTest: 0.05
    });

    for (let i = 0; i < 12; i++) {
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(2.2, 2.2, 1);

      const angle = Math.random() * Math.PI * 2;
      const distance = 12 + Math.random() * 55;
      sprite.position.set(
        Math.sin(angle) * distance,
        1.1,
        Math.cos(angle) * distance
      );

      sprite.userData.phase = Math.random() * 10;
      scene.add(sprite);
      cats.push(sprite);
    }

    $("count").textContent = cats.length + " 匹";
    return true;
  } catch (e) {
    console.error(e);
    say("cat.pngを読み込めません。ファイル名と場所を確認してね。");
    return false;
  }
}

async function loadMusic() {
  const audio = $("bgm");
  for (const url of candidates("bgm.mp3")) {
    try {
      const response = await fetch(url, { method: "HEAD" });
      if (response.ok) {
        audio.src = url;
        return true;
      }
    } catch (e) {}
  }
  console.warn("bgm.mp3が見つかりません");
  return false;
}

function setupControls() {
  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
  });

  addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
  });

  let activeMove = null;
  let activeLook = null;
  let prevX = 0, prevY = 0;

  renderer.domElement.addEventListener("pointerdown", e => {
    if (!started) return;
    renderer.domElement.setPointerCapture(e.pointerId);

    if (e.clientX < innerWidth * 0.45) {
      activeMove = e.pointerId;
      moveX = 0;
      moveZ = 0;
    } else {
      activeLook = e.pointerId;
      prevX = e.clientX;
      prevY = e.clientY;
    }
  });

  renderer.domElement.addEventListener("pointermove", e => {
    if (e.pointerId === activeMove) {
      const rect = renderer.domElement.getBoundingClientRect();
      moveX = THREE.MathUtils.clamp(
        (e.clientX / rect.width - 0.2) * 2, -1, 1
      );
      moveZ = THREE.MathUtils.clamp(
        (e.clientY / rect.height - 0.75) * 2, -1, 1
      );
    }

    if (e.pointerId === activeLook) {
      yaw -= (e.clientX - prevX) * 0.004;
      pitch -= (e.clientY - prevY) * 0.003;
      pitch = THREE.MathUtils.clamp(pitch, -1.2, 1.2);
      prevX = e.clientX;
      prevY = e.clientY;
    }
  });

  function release(e) {
    if (e.pointerId === activeMove) {
      activeMove = null;
      moveX = 0;
      moveZ = 0;
    }
    if (e.pointerId === activeLook) activeLook = null;
  }

  renderer.domElement.addEventListener("pointerup", release);
  renderer.domElement.addEventListener("pointercancel", release);
}

function update(dt) {
  if (!started) return;

  let x = moveX;
  let z = moveZ;

  if (keys["a"] || keys["arrowleft"]) x -= 1;
  if (keys["d"] || keys["arrowright"]) x += 1;
  if (keys["w"] || keys["arrowup"]) z -= 1;
  if (keys["s"] || keys["arrowdown"]) z += 1;

  const length = Math.hypot(x, z);
  if (length > 1) {
    x /= length;
    z /= length;
  }

  const speed = 12 * dt;
  camera.position.x +=
    (Math.cos(yaw) * x + Math.sin(yaw) * z) * speed;
  camera.position.z +=
    (Math.sin(yaw) * x - Math.cos(yaw) * z) * speed;

  camera.position.y = 2;
  camera.rotation.set(pitch, yaw, 0, "YXZ");

  cats.forEach(cat => {
    cat.userData.phase += dt;
    cat.position.y = 1.1 + Math.sin(cat.userData.phase * 2) * 0.08;
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  if (!camera || !renderer) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

async function main() {
  initThree();
  setupControls();

  const stageOK = await loadStage();
  const catsOK = await loadCats();
  await loadMusic();

  if (stageOK && catsOK) {
    say("準備完了！スタートを押してね。");
  } else {
    say("一部の素材が未読込です。GitHubのファイル名を確認してね。");
  }

  animate();
}

$("startBtn").addEventListener("click", async () => {
  started = true;
  $("start").style.display = "none";
  $("message").style.display = "none";

  const audio = $("bgm");
  try {
    await audio.play();
  } catch (e) {
    say("BGMは再生できませんでした。画面をタップして再試行してね。");
  }
});

main().catch(e => {
  console.error(e);
  say("起動エラー: " + (e.message || e));
});
</script>
</body>
</html>
